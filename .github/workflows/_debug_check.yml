name: TEMP Debug Check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python _debug_check_odds_injuries.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BIGBALLS_API_KEY: ${{ secrets.BIGBALLS_API_KEY }}
