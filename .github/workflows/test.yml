name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Gates every push/PR on the existing pytest suite (200+ tests) — previously
# nothing in CI ran them, so a broken commit had no automated safety net.
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite
        run: pytest -q
