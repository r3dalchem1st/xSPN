name: Update WC 2026 Predictions

on:
  schedule:
    # Twice daily, ~9am/9pm Barcelona time. Times are UTC; Barcelona is
    # currently CEST (UTC+2) -- GitHub cron does NOT follow DST, so this
    # drifts an hour once Barcelona switches to CET in late Oct.
    # Minute offset (:05) keeps this off the top-of-hour load spike and
    # staggered from the other 3 update-*.yml workflows below, since all
    # four rebuild the shared index.html hub and a same-minute cron hits
    # that race every day.
    #   07:05 UTC = 09:05 Barcelona
    #   19:05 UTC = 21:05 Barcelona
    - cron: '5 7 * * *'
    - cron: '5 19 * * *'
  workflow_dispatch:
    # Allows you to trigger it manually from the GitHub website

# Serialise runs so overlapping schedules/manual triggers never race on push.
# cancel-in-progress: false → a new run waits for the in-flight one to finish.
concurrency:
  group: update-predictions
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backtest quality gate (fails on model regression)
        run: python backtest.py

      - name: Fetch new match results
        env:
          FD_API_KEY: ${{ secrets.FD_API_KEY }}
        run: python fetch_matches.py

      - name: Fetch injuries (optional)
        # Populates injuries.json from API-Football, valued via player_values.json.
        # No API_FOOTBALL_KEY -> no-op. continue-on-error so a quota/API hiccup
        # never breaks the daily forecast.
        continue-on-error: true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python fetch_injuries.py

      - name: Fetch cards (optional)
        # Populates cards.json (yellow/red cards per team) from API-Football.
        # No API_FOOTBALL_KEY -> no-op. continue-on-error so a quota/API hiccup
        # never breaks the daily forecast. Display-only (does not feed the model).
        continue-on-error: true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python fetch_cards.py

      - name: Score predictions against actual results
        run: python score_predictions.py

      - name: Validate match data
        run: python validate_data.py

      - name: Refit model (Dixon-Coles + Elo)
        run: python fit_improved.py

      - name: Run simulations (75,000 tournaments)
        run: python sim_improved.py

      - name: Generate bracket predictions
        run: python bracket_predictor.py

      - name: Snapshot pre-match predictions
        run: python snapshot_predictions.py

      - name: Validate prediction snapshot (fails on fabricated/mislabeled locks)
        run: python validate_snapshot.py

      # World Cup page now lives at competitions/world_cup_2026/ (moved off root
      # 23 Jul — root is the site-wide hub, see build_hub_html.py below).
      - name: Build World Cup page
        run: python build_html.py

      - name: Build site-wide hub page
        # Rebuilds root index.html (every competition's card, including this one's
        # champion/results snapshot) whenever the WC's own data changes — the
        # round-robin workflow (update-leagues.yml) rebuilds the same hub for the
        # same reason on its own schedule, so whichever last touched the site keeps
        # the hub current.
        run: python build_hub_html.py

      - name: Commit and push updated files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add index.html competitions/world_cup_2026/index.html model_params.json wc2026_v2_results.json bracket_data.json fetched_matches.json predictions_snapshot.json results_accuracy.json win_history.json backtest_results.json wc_schedule.json injuries.json cards.json
          git diff --staged --quiet && echo "No changes to commit." && exit 0
          git commit -m "Auto-update predictions: $(date +'%Y-%m-%d')"
          # Retry push against concurrent updates (overlapping runs / manual pushes):
          # rebase the auto-commit onto the latest main and try again. index.html is the
          # one file update-leagues.yml also rebuilds independently, so a conflict there is
          # spurious (both sides are just a stale build of the same script) rather than real
          # data loss -- auto-resolve with -X ours (whichever text wins doesn't matter) then
          # rebuild it fresh from the merged data before pushing again.
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rejected (attempt $i) — rebasing on latest main and retrying..."
            git rebase --abort >/dev/null 2>&1 || true
            git pull --rebase --autostash -X ours origin main || { git rebase --abort >/dev/null 2>&1 || true; git pull --no-rebase --autostash -X ours origin main; }
            python build_hub_html.py
            git add index.html
            git commit --amend --no-edit
          done
          echo "Push failed after 5 attempts." >&2
          exit 1
