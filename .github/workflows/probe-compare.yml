name: Probe football-data.org vs openfootball (one-off, manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Compare the two sources for the finished 2025-26 edition
        env:
          FD_API_KEY: ${{ secrets.FD_API_KEY }}
        run: python probe_compare.py
